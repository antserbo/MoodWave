# --- PostgreSQL datasource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/affectflux
spring.datasource.username=affectflux
spring.datasource.password=affectflux
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway migrations ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Remove after first baseline/migration if you had added:
# spring.flyway.baseline-on-migrate=true

# --- Disable H2 console (avoid misleading message) ---
spring.h2.console.enabled=false
