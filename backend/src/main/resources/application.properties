spring.application.name=affectflux-api
# --- DataSource (H2 in-memory) ---
spring.datasource.url=jdbc:h2:mem:affectflux;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- H2 console (handy for debugging) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.root=INFO

# --- Paging defaults ---
app.paging.max-size=100

server.error.include-stacktrace=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.affectflux.moods
springdoc.paths-to-match=/api/**


# logging.level.org.springdoc=DEBUG
# logging.level.org.springdoc.core=DEBUG
logging.level.org.springdoc=INFO
logging.level.org.springdoc.core=INFO

