services:
  db:
    image: postgres:16
    container_name: affectflux-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-affectflux}
      POSTGRES_USER: ${POSTGRES_USER:-affectflux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-affectflux}
    ports:
      - "5432:5432"         # expose for local tools; remove in prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-affectflux} -d ${POSTGRES_DB:-affectflux}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: affectflux-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Optional if you want consistent timestamps:
      # SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_TIME_ZONE: UTC
    ports:
      - "8080:8080"
    # For hot-reload dev you *could* mount code, but with Spring Boot + Maven
    # we typically rebuild the jar instead. Keeping this clean for now.

volumes:
  pgdata:
